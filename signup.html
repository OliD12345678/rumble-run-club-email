<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Count Me In — Rumble Run Club</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
    .page{min-height:100vh;padding:28px 16px 48px;background:radial-gradient(circle at top right,#182500 0,#050505 45%)}
    .card{max-width:680px;margin:0 auto;background:#111;border:1px solid #2b2b2b;border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45)}
    .hero{width:100%;display:block;height:auto}
    .content{padding:30px}
    h1{margin:0 0 8px;font-size:38px;line-height:1;font-weight:900;text-transform:uppercase}
    .lead{margin:0 0 26px;color:#d9d9d9;font-size:17px;line-height:1.5}
    label{display:block;margin:0 0 8px;font-weight:800}
    input,textarea{width:100%;padding:14px 15px;margin:0 0 18px;border:1px solid #3a3a3a;border-radius:8px;background:#090909;color:#fff;font:inherit}
    input:focus,textarea:focus{outline:2px solid #b7f000;border-color:#b7f000}
    .choice{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;margin-bottom:10px;border:1px solid #333;border-radius:8px;background:#090909}
    .choice input{width:auto;margin:3px 0 0}
    .choice label{margin:0;font-weight:700;cursor:pointer}
    .submit{width:100%;margin-top:18px;padding:16px;border:0;border-radius:8px;background:#b7f000;color:#000;font-size:20px;font-weight:900;cursor:pointer}
    .submit:hover{filter:brightness(1.05)}
    .fine{margin:16px 0 0;color:#999;font-size:12px;line-height:1.45;text-align:center}
    .back{display:block;margin:22px auto 0;color:#b7f000;text-align:center;text-decoration:none;font-weight:700}
    @media(max-width:600px){.content{padding:24px 20px}h1{font-size:32px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <img src="assets/01-hero.jpg" class="hero" alt="Rumble Run Club August 8 and 15">
      <div class="content">
        <h1>Count Me In!</h1>
        <p class="lead">Reserve your spot for Rumble Run Club. All are welcome, and all fitness levels are welcome.</p>

        <form action="https://run.alpharetta.fit/signup/submit" method="POST" accept-charset="UTF-8">
          <input type="hidden" name="_next" value="https://olid12345678.github.io/rumble-run-club-email/thank-you.html">
          <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

          <label for="name">Name</label>
          <input id="name" name="Name" type="text" autocomplete="name" required>

          <label for="email">Email</label>
          <input id="email" name="Email" type="email" autocomplete="email" required>

          <label for="phone">Phone</label>
          <input id="phone" name="Phone" type="tel" autocomplete="tel" required>

          <label>Which date are you joining us?</label>
          <div class="choice">
            <input id="aug8" name="Run Date" type="radio" value="August 8 at 8:30 AM" required>
            <label for="aug8">August 8 at 8:30 AM</label>
          </div>
          <div class="choice">
            <input id="aug15" name="Run Date" type="radio" value="August 15 at 8:30 AM">
            <label for="aug15">August 15 at 8:30 AM</label>
          </div>
          <div class="choice">
            <input id="both" name="Run Date" type="radio" value="Both dates: August 8 and August 15 at 8:30 AM">
            <label for="both">Both dates</label>
          </div>

          <label for="note" style="margin-top:18px">Anything we should know? <span style="font-weight:400;color:#999">(optional)</span></label>
          <textarea id="note" name="Note" rows="4"></textarea>

          <button class="submit" type="submit">COUNT ME IN!</button>
          <p class="fine">Submitting this form sends your registration details to Rumble Boxing Alpharetta.</p>
        </form>
        <a class="back" href="index.html">Back to the Run Club invitation</a>
      </div>
    </section>
  </main>
</body>
</html>

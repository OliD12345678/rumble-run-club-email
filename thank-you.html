<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>You're In — Rumble Run Club</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
    .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at top right,#182500 0,#050505 45%)}
    .card{max-width:620px;text-align:center;background:#111;border:1px solid #2b2b2b;border-radius:16px;padding:44px 30px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
    .check{width:76px;height:76px;margin:0 auto 22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#b7f000;color:#000;font-size:42px;font-weight:900}
    h1{margin:0 0 14px;font-size:40px;text-transform:uppercase}
    p{margin:0;color:#ddd;font-size:18px;line-height:1.55}
    a{display:inline-block;margin-top:28px;padding:14px 24px;background:#b7f000;color:#000;text-decoration:none;border-radius:7px;font-weight:900}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="check">✓</div>
      <h1>You're In!</h1>
      <p>Your Rumble Run Club registration was submitted.<br>We’ll see you at Rumble Boxing Alpharetta.</p>
      <a href="index.html">BACK TO THE INVITATION</a>
    </section>
  </main>
</body>
</html>
